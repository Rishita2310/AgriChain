[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clear_users"
path = "src/bin/clear_users.rs"

[[bin]]
name = "fix_dates"
path = "src/bin/fix_dates.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
bson = "3.1.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
ethers = "2.0.14"
futures = "0.3.31"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
mongodb = "3.8.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12.9", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = "0.21.0"
uuid = { version = "1.13.1", features = ["v4"] }

[[bin]]
name = "test_deser"
path = "src/bin/test_deser.rs"
