[package]
name = "agrichain-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Arbitrum Stylus Decentralized Agricultural Escrow Smart Contract"

[dependencies]
alloy-primitives = "=0.8.20"
alloy-sol-types = "=0.8.20"
stylus-sdk = "0.8.2"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
opt-level = "s"
panic = "abort"
