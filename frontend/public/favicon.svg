<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="800" height="800" fill="none">
  <defs>
    <!-- Sprout Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Blockchain Ring Glow -->
    <linearGradient id="chain-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scale wrapper added to enhance inner icon size while keeping it centered -->
  <g transform="translate(-76.8, -76.8) scale(1.3)">
    
    <!-- Decentralized Blockchain Nodes & Orbit Rings (AgriChain Link) -->
    <g stroke="url(#chain-grad)" stroke-width="20" stroke-linecap="round" fill="none" filter="url(#glow)">
      <!-- Interlocking Hexagonal Node Link -->
      <path d="M256 128 L352 184 V296 L256 352 L160 296 V184 Z" opacity="0.4" stroke-dasharray="12 12" />
      <circle cx="256" cy="128" r="18" fill="#34d399" stroke="none" />
      <circle cx="352" cy="184" r="14" fill="#fbbf24" stroke="none" />
      <circle cx="352" cy="296" r="14" fill="#34d399" stroke="none" />
      <circle cx="160" cy="184" r="14" fill="#34d399" stroke="none" />
      <circle cx="160" cy="296" r="14" fill="#fbbf24" stroke="none" />
    </g>

    <!-- Central Vibrant Sprout / Leaf (Agri Harvest Emblem) -->
    <g filter="url(#glow)">
      <!-- Right Main Leaf -->
      <path d="M256 390 C256 390 370 330 370 230 C370 150 290 130 256 130 C256 130 240 220 256 390 Z" fill="url(#leaf-grad)" />
      
      <!-- Left Leaf -->
      <path d="M256 390 C256 390 142 330 142 230 C142 160 210 140 256 140 C240 230 256 390 256 390 Z" fill="#10b981" opacity="0.9" />

      <!-- Leaf Center Stem Rib -->
      <path d="M256 390 Q256 260 256 130" stroke="#064e3b" stroke-width="12" stroke-linecap="round" opacity="0.6" />
      <path d="M256 300 Q300 260 330 230" stroke="#064e3b" stroke-width="8" stroke-linecap="round" opacity="0.5" />
      <path d="M256 270 Q210 240 180 210" stroke="#064e3b" stroke-width="8" stroke-linecap="round" opacity="0.5" />
    </g>
  </g>
</svg>
